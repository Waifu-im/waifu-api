name: waifu-api
services:
  backend:
    image: ghcr.io/waifu-im/waifu-api-backend:latest
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    image: ghcr.io/waifu-im/waifu-api-frontend:latest
    env_file:
      - .env
    ports:
      - "8084:80"
    depends_on:
      - backend
    restart: always

  db:
    image: pgvector/pgvector:pg18
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    ports:
      - "54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-waifuapi}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
