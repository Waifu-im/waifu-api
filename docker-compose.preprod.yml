name: waifu-api-preprod
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.preprod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=${API_BASE_URL}
      - VITE_DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - VITE_DISCORD_REDIRECT_URI=${FRONTEND_URL}/auth/callback
      - VITE_APP_TITLE=${APP_NAME}
      - VITE_DOCS_URL=${DOCS_URL}
      - VITE_CONTACT_EMAIL=${CONTACT_EMAIL}
      - VITE_DISCORD_SERVER_URL=${DISCORD_SERVER_URL}
      - VITE_STATUS_URL=${STATUS_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: always

#  docs:
#    build:
#      context: .
#      dockerfile: docs/Dockerfile
#      args:
#        VERSION: ${VERSION:-0.0.0}
#        DOCS_URL: ${DOCS_URL}
#        DOCS_BASE_URL: ${DOCS_BASE_URL}
#        DOCS_ORG_NAME: ${DOCS_ORG_NAME}
#        DOCS_PROJECT_NAME: ${DOCS_PROJECT_NAME}
#        API_BASE_URL: ${API_BASE_URL}
#        APP_NAME: ${APP_NAME}
#        APP_TAGLINE: ${APP_TAGLINE}
#        FRONTEND_URL: ${FRONTEND_URL}
#        GITHUB_URL: ${GITHUB_URL}
#    ports:
#      - "${DOCS_PORT}:80"
#    restart: always

  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    ports:
      - "${POSTGRES_PORT_EXTERNAL}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer
    restart: always
    ports:
      - "9004:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
