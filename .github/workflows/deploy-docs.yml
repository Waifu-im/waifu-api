name: Deploy Documentation

on:
  push:
    branches: [main]
    tags: [ 'v*.*.*' ]
    paths:
      - "docs/**"
      - "backend/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by MinVer for version calculation
          fetch-tags: true

      - name: Fetch all tags
        run: git fetch --tags --force

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate OpenAPI spec from backend build
        run: dotnet build backend/WaifuApi.Web/WaifuApi.Web.csproj -c Release /p:OpenApiGenerateDocumentsOnBuild=true
        env:
          ASPNETCORE_ENVIRONMENT: CI

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Generate API docs from OpenAPI spec
        working-directory: docs
        run: npx docusaurus gen-api-docs all
        env:
          DOCS_URL: https://docs.waifu.im
          DOCS_BASE_URL: /
          DOCS_ORG_NAME: Waifu-im
          DOCS_PROJECT_NAME: waifu-api
          API_BASE_URL: https://api.waifu.im
          APP_NAME: Waifu.im
          APP_TAGLINE: "The API for your Waifu content. Access thousands of categorized anime illustrations via our robust REST API or browse freely."
          FRONTEND_URL: https://www.waifu.im
          GITHUB_URL: https://github.com/Waifu-im/waifu-api
      - name: Build documentation
        working-directory: docs
        run: npm run build
        env:
          DOCS_URL: https://docs.waifu.im
          DOCS_BASE_URL: /
          DOCS_ORG_NAME: Waifu-im
          DOCS_PROJECT_NAME: waifu-api
          API_BASE_URL: https://api.waifu.im
          APP_NAME: Waifu.im
          APP_TAGLINE: "The API for your Waifu content. Access thousands of categorized anime illustrations via our robust REST API or browse freely."
          FRONTEND_URL: https://www.waifu.im
          GITHUB_URL: https://github.com/Waifu-im/waifu-api

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
