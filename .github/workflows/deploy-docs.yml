name: Deploy Documentation

on:
  push:
    # Trigger ONLY on version tags
    tags: [ 'v*.*.*' ]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_URL: https://docs.waifu.im
  DOCS_BASE_URL: /
  DOCS_ORG_NAME: Waifu-im
  DOCS_PROJECT_NAME: waifu-api
  API_BASE_URL: https://api.waifu.im
  APP_NAME: Waifu.im
  APP_TAGLINE: "The API for your Waifu content. Access thousands of categorized anime illustrations via our robust REST API or browse freely."
  FRONTEND_URL: https://www.waifu.im
  GITHUB_URL: https://github.com/Waifu-im/waifu-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags
        run: git fetch --tags --force

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Calculate version
        id: version
        working-directory: ./backend
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # Fallback to minver CLI for manual dispatch
            dotnet tool install --global minver-cli
            VERSION=$(minver --tag-prefix v)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate OpenAPI spec from backend build
        run: dotnet build backend/WaifuApi.Web/WaifuApi.Web.csproj -c Release /p:OpenApiGenerateDocumentsOnBuild=true /p:Version=${{ steps.version.outputs.VERSION }}
        env:
          ASPNETCORE_ENVIRONMENT: CI

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Generate API docs from OpenAPI spec
        working-directory: docs
        run: npx docusaurus gen-api-docs all

      - name: Build documentation
        working-directory: docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
